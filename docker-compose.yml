services:
  postgres:
    image: postgres:18
    container_name: logs-postgres
    environment:
      POSTGRES_USER: logs_user
      POSTGRES_PASSWORD: logs_password
      POSTGRES_DB: logs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs_user -d logs_db"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    container_name: logs-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://logs_user:logs_password@postgres:5432/logs_db
      PORT: 8080
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: